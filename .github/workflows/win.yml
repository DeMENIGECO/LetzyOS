name: Build LetzyOS Windows Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build LetzyOS
        run: |
          pyinstaller main.py --name="letzyos"

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist/letzyos -DestinationPath letzyos_windows.zip

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: letzyos_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
