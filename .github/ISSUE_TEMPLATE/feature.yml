name: "✨ Feature Request"
description: "Proponi una nuova funzionalità per LetzyOS."
title: "[FEATURE] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Grazie per aver proposto una nuova funzionalità per LetzyOS! 🦎
        Descrivi la tua idea nel modo più chiaro possibile.

  - type: textarea
    id: feature
    attributes:
      label: Funzionalità richiesta
      description: Descrivi la funzionalità che vorresti aggiungere.
      placeholder: "Vorrei aggiungere..."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Perché sarebbe utile?
      description: Spiega perché questa funzionalità potrebbe essere utile agli utenti.
      placeholder: "Questa funzionalità sarebbe utile perché..."
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Esempio di utilizzo
      description: Mostra come potrebbe essere utilizzata la nuova funzionalità.
      placeholder: |
        Esempio:

        comando esempio
        Output...
      render: text
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Possibile implementazione
      description: Se hai un'idea su come implementare la funzionalità, descrivila qui.
      placeholder: "Potrebbe essere implementata..."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Versione di LetzyOS
      description: Indica la versione utilizzata quando proponi la funzionalità.
      placeholder: "es. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Informazioni aggiuntive
      description: Aggiungi eventuali screenshot, esempi o altri dettagli.
      placeholder: "Altri dettagli..."
    validations:
      required: false
